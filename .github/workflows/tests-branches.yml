# Tests complets (avec FFmpeg et ExifTool réels) sur Linux, Windows et macOS à chaque push d'une branche feature/**.
# Les tests de bout en bout (conversion, Takeout, Rename…) sont ignorés quand ces binaires manquent : on les installe
# ici pour qu'ils tournent vraiment. Les paquets distribuables restent construits par build.yml.
name: tests-branches

on:
  push:
    branches: ["feature/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-branches-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Bibliothèques système (Qt) et outils (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libfontconfig1 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libxcb-xkb1 libxcb-util1 ffmpeg libimage-exiftool-perl
      - name: FFmpeg et ExifTool (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg exiftool
      - name: FFmpeg et ExifTool (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg exiftool -y --no-progress
          Get-Command ffmpeg, ffprobe, exiftool | Format-Table Name, Source
      - run: python -m pip install -U pip
      - run: pip install -r requirements.txt -r requirements-dev.txt pillow-heif rawpy psutil
      - name: Versions des outils
        run: |
          python --version
          ffmpeg -version | head -n 1
          exiftool -ver
        shell: bash
        continue-on-error: true
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          pytest -q -rfEs --tb=short -p no:cacheprovider 2>&1 | tee pytest-out.txt
      - name: Résumé des échecs (annotations)
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import re
          text = open("pytest-out.txt", encoding="utf-8", errors="replace").read()
          text = text[-30000:]
          chunks = [text[i:i + 3000] for i in range(0, len(text), 3000)][-9:]
          for n, c in enumerate(chunks, 1):
              c = c.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title=pytest {n}/{len(chunks)}::{c}")
          PY
