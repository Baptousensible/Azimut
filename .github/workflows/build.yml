# À placer dans .github/workflows/build.yml
# Squelette : tests sur 3 OS, paquet PyInstaller par plateforme, auto-test du paquet, artefacts.
# Les binaires (ffmpeg, ffprobe, exiftool) ne sont pas dans le dépôt : l'étape « Binaires » est à
# adapter (cache, release privée, ou téléchargement depuis les sites officiels, avec empreinte).
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - name: Bibliothèques système (Qt sous Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0
      - run: python -m pip install -U pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,   tag: linux-x64,    name: Azimut-linux-x64 }
          - { os: windows-latest, tag: windows-x64,  name: Azimut-windows-x64 }
          - { os: macos-14,       tag: macos-arm64,  name: Azimut-macos-arm64 }
          - { os: macos-13,       tag: macos-x64,    name: Azimut-macos-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Bibliothèques système (Qt sous Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0
      - run: python -m pip install -U pip
      # Extras facultatifs INDISPENSABLES au paquet : HEIC, corbeille, écriture AVIF (Pillow >= 11.3)
      - run: pip install -r requirements.txt pillow-heif send2trash "Pillow>=11.3" pyinstaller
      - name: Binaires (à adapter)
        shell: bash
        run: |
          mkdir -p "bin/${{ matrix.tag }}"
          echo "TODO : déposer ffmpeg, ffprobe, exiftool (+ exiftool_files / lib) dans bin/${{ matrix.tag }}"
      - name: Construire
        run: python packaging/build.py
      - name: Auto-test du paquet (sans interface)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then EXE="dist/Azimut.app/Contents/MacOS/Azimut";
          elif [ "$RUNNER_OS" = "Windows" ]; then EXE="dist/Azimut/Azimut.exe";
          else EXE="dist/Azimut/Azimut"; fi
          "$EXE" --selftest selftest.json || { cat selftest.json; exit 1; }
          cat selftest.json
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/
            selftest.json
