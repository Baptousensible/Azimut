[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azimut"
dynamic = ["version"]
description = "Azimut : suite d'utilitaires de bureau pour photos, vidéos, audio et JSON."
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "Pillow>=10.0",
]

[tool.setuptools.dynamic]
version = { attr = "azimut.__version__" }

[tool.setuptools.packages.find]
include = ["azimut*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
